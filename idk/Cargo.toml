[package]
authors = ["Sebastian Rousseau <sebastian.rousseau@gmail.com"]
categories = [
    "authentication",
    "cryptography",
    "data-structures",
    "development-tools",
    "encoding",
]
description = "A Rust library for managing errors and exceptions"
edition = "2021"
homepage = "https://minifunctions.com/"
keywords = ["idk", "error-handling", "error", "exception-handling", "failure"]
license = "MIT OR Apache-2.0"
name = "idk"
repository = "https://github.com/sebastienrousseau/mini-functions/tree/main/errors/"
rust-version = "1.66.1"
version = "0.0.1"
include = [
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[dependencies]
base64 = "0.23.0"
hmac = "0.13.0"
jwt = "0.16.0"
serde_json = "1.0.108"

[dev-dependencies]
criterion = "0.8.2"

[lib]
crate-type = ["lib"]
name = "idk"
path = "src/lib.rs"

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# src/lib.rs carries `#![cfg_attr(feature = "bench", feature(test))]` for
# nightly benchmarking. `bench` is deliberately NOT a real [features]
# entry: declaring it would make --all-features turn it on, and
# `feature(test)` is nightly-only (E0554 on the stable channel CI uses).
# Declaring the cfg here tells rustc the value is expected, so
# unexpected_cfgs stays quiet under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bench"))'] }
