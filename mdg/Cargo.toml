[package]
authors = ["Sebastian Rousseau <sebastian.rousseau@gmail.com"]
categories = ["cryptography", "encoding", "algorithms"]
description = "A Rust library that implements the MD5 cryptographic hash function"
edition = "2021"
homepage = "https://minifunctions.com/"
keywords = ["md5", "mdg", "digest", "encryption", "hash"]
license = "MIT OR Apache-2.0"
name = "mdg"
repository = "https://github.com/sebastienrousseau/mini-functions/tree/main/mdg/"
rust-version = "1.67"
version = "0.0.1"
include = [
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[[bench]]
name = "mdg"
harness = false
path = "benches/mdg.rs"

[dependencies]
cjwt = { version = "0.0.1", path = "../cjwt" }

[dev-dependencies]
criterion = "0.8.2"

[lib]
name = "mdg"
crate-type = ["lib"]
path = "src/lib.rs"

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# src/lib.rs carries `#![cfg_attr(feature = "bench", feature(test))]` for
# nightly benchmarking. `bench` is deliberately NOT a real [features]
# entry: declaring it would make --all-features turn it on, and
# `feature(test)` is nightly-only (E0554 on the stable channel CI uses).
# Declaring the cfg here tells rustc the value is expected, so
# unexpected_cfgs stays quiet under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bench"))'] }
