[licenses]
# cargo-deny removed `unlicensed`, `copyleft`, `allow-osi-fsf-free`
# and the licence `deny` list (EmbarkStudios/cargo-deny#611). Only
# `allow` remains: a crate must satisfy its licence expression with
# licences named here, and a crate with no detectable licence is
# always an error (what `unlicensed = "deny"` said).
#
# The old policy was: MPL-2.0 explicitly, plus any licence that is
# OSI-approved or FSF Free/Libre, except copyleft ones. The list below
# is that policy applied to every licence in the dependency graph
# (all features). LGPL-2.1-or-later (r-efi offers it besides MIT and
# Apache-2.0) stays out, as copyleft did. A licence the old blanket
# rule would have let in and that is not listed here now needs adding
# by hand.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
# * lowest-version - The path to the lowest versioned duplicate is highlighted
# * simplest-path - The path to the version with the fewest edges is highlighted
# * all - Both lowest-version and simplest-path are used
highlight = "all"

# List of crates that are allowed. Use with care!
allow = [
]

# List of crates to deny
deny = [
    # Each entry the name of a crate and a version range. If version is
    # not specified, all versions will be matched.
]

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
]

# Similarly to `skip` allows you to skip certain crates during duplicate detection,
# unlike skip, it also includes the entire tree of transitive dependencies starting at
# the specified crate, up to a certain depth, which is by default infinite
skip-tree = [
]


[advisories]
ignore = [
]
