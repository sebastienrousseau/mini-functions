[package]
authors = ["Sebastian Rousseau <sebastian.rousseau@gmail.com"]
categories = [
    "Authentication",
    "Cryptography",
    "Development tools",
    "Encoding",
    "Web programming",
]
description = "A Rust library for working with JSON Web Tokens (JWTs) and JSON Web Signatures (JWSs)"
edition = "2021"
homepage = "https://minifunctions.com/"
keywords = ["api", "cjwt", "json", "jws", "jwt"]
license = "MIT OR Apache-2.0"
name = "cjwt"
repository = "https://github.com/sebastienrousseau/mini-functions/tree/main/cjwt/"
rust-version = "1.66.1"
version = "0.0.1"
include = [
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[[bench]]
name = "cjwt"
harness = false
path = "benches/cjwt.rs"

[dependencies]
base64 = "0.23.0"
cclm = { version = "0.0.1", path = "../cclm" }
dtt = "0.0.11"
hmac = "0.13.0"
idk = { version = "0.0.1", path = "../idk" }
jwt = "0.16.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
sha2 = "0.11.0"

[dev-dependencies]
criterion = "0.8.2"

[lib]
crate-type = ["lib"]
name = "cjwt"
path = "src/lib.rs"

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# src/lib.rs carries `#![cfg_attr(feature = "bench", feature(test))]` for
# nightly benchmarking. `bench` is deliberately NOT a real [features]
# entry: declaring it would make --all-features turn it on, and
# `feature(test)` is nightly-only (E0554 on the stable channel CI uses).
# Declaring the cfg here tells rustc the value is expected, so
# unexpected_cfgs stays quiet under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bench"))'] }
